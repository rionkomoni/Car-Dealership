apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "car-dealership.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: {{ include "car-dealership.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "car-dealership.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: {{ include "car-dealership.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "car-dealership.fullname" . }}-backend-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
