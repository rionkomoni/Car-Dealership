services:
  - type: web
    name: car-dealership
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && cd frontend && npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_HTTPS
        value: "true"
      - key: PORT
        value: "10000"
      - key: MYSQL_AUTO_CREATE_DB
        value: "false"
      - key: REACT_APP_API_URL
        value: https://api.cardealership.fit
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        value: "12345678"
      - key: MANAGER_EMAIL
        value: manager@gmail.com
      - key: MANAGER_PASSWORD
        value: "12345678"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: EXPOSE_ACTIVATION_LINK
        value: "true"
      - key: EXPOSE_PASSWORD_RESET_LINK
        value: "true"
      # Sekretet — vendosi manualisht në Render Dashboard (mos i commit në Git):
      # MONGO_URI, MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD, MYSQL_DB, JWT_SECRET
